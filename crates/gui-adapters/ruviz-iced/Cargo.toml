[package]
name = "ruviz-iced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Iced widget adapter for ruviz"
readme = "README.md"
include = ["src/**", "examples/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
"3d" = ["ruviz/3d"]
gpu = ["ruviz/gpu"]
"3d-gpu" = ["3d", "gpu"]

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "advanced",
    "image",
    "thread-pool",
    "wayland",
    "x11",
] }
futures = "0.3"
async-channel = "2"
ruviz = { version = "=0.6.0", path = "../../.." }

[dev-dependencies]
iced = { version = "0.14", default-features = false, features = ["advanced", "image", "thread-pool", "tiny-skia", "x11", "wayland"] }
iced_runtime = "0.14"

[[example]]
name = "dashboard_2d"

[[example]]
name = "dashboard"
required-features = ["3d"]

[[example]]
name = "static_dashboard"
required-features = ["3d"]
