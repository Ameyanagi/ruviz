name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Keep Pages deployments serialized without PR checks cancelling deployments.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-docs:
    name: Check Documentation Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            adapters/gpui/target
          key: ${{ runner.os }}-cargo-docs-examples-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-docs-examples-

      - name: Install Linux desktop build dependencies
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Install JS workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check Markdown links and examples
        run: uv run python scripts/check_docs.py

      - name: Check GPUI documentation examples
        run: |
          cargo test --manifest-path adapters/gpui/Cargo.toml --doc --locked
          cargo test --manifest-path adapters/gpui/Cargo.toml --doc --all-features --locked

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install Linux desktop build dependencies
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Build documentation
        run: cargo doc --no-deps --all-features

      - name: Build native GUI adapter documentation
        run: cargo doc --manifest-path adapters/gui/Cargo.toml --workspace --all-features --no-deps --locked
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          RUSTDOCFLAGS: -D warnings

      - name: Build GPUI documentation
        run: cargo doc --manifest-path adapters/gpui/Cargo.toml --all-features --no-deps --locked
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          RUSTDOCFLAGS: -D warnings

      - name: Add redirect to ruviz docs
        run: echo '<meta http-equiv="refresh" content="0; url=ruviz/index.html">' > target/doc/index.html

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: [check-docs, build-docs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
