name: CI

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--all` means "all members of this workspace", and ruviz-gpui is its own
      # workspace now, so without this step its sources would stop being format
      # checked. `cargo fmt` only reads the manifest, so this costs nothing —
      # it never resolves the zed GPUI checkout.
      - name: Check ruviz-gpui formatting
        run: cargo fmt --all --manifest-path adapters/gpui/Cargo.toml -- --check

      - name: Check native GUI adapter formatting
        run: cargo fmt --all --manifest-path adapters/gui/Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux desktop build dependencies
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            adapters/gpui/target
            adapters/gui/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy -p ruviz --all-targets --all-features -- -D warnings

      - name: Run clippy for the 3D GPU feature surface
        run: cargo clippy -p ruviz --no-default-features --features 3d,gpu -- -D warnings

      # ruviz-gpui is its own workspace (see the root Cargo.toml), so it is not
      # reachable by `-p` from here and needs an explicit manifest path. This is
      # the only CI step that resolves the zed GPUI checkout.
      - name: Run clippy for the GPUI default and 3D feature surfaces
        run: |
          cargo clippy --manifest-path adapters/gpui/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path adapters/gpui/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Run clippy for native GUI adapters
        run: |
          cargo clippy --manifest-path adapters/gui/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path adapters/gui/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test production unwrap checker
        run: python3 -m unittest scripts/test_check_no_new_production_unwraps.py

      - name: Reject new production unwrap and panic calls
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin \
              "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
            comparison_base="origin/${PR_BASE_REF}"
          elif [[ "${EVENT_BEFORE}" =~ ^[0-9a-f]{40}$ ]] &&
               [[ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]] &&
               git cat-file -e "${EVENT_BEFORE}^{commit}"; then
            comparison_base="${EVENT_BEFORE}"
          else
            comparison_base="HEAD^"
          fi
          python3 scripts/check_no_new_production_unwraps.py --base "${comparison_base}"

  packaged-crates:
    name: Packaged Crates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Cache cargo sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-packaged-crates-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-packaged-crates-

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Test packaged-crate verifier
        run: uv run python -m unittest scripts/test_verify_packaged_crates.py

      - name: Verify packaged crates from an external consumer
        run: uv run python scripts/verify_packaged_crates.py --mode ci

  gui-adapter-packages:
    name: Packaged Native GUI Adapters
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install Linux desktop build dependencies
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Cache GUI adapter package sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            adapters/gui/target
          key: ${{ runner.os }}-cargo-gui-adapter-packages-${{ hashFiles('adapters/gui/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-gui-adapter-packages-

      - name: Test native GUI adapter package verifier
        run: uv run python -m unittest scripts/test_verify_gui_adapter_packages.py

      - name: Verify packaged adapters from a fresh consumer
        run: uv run python scripts/verify_gui_adapter_packages.py --mode ci

  native-gui-tests:
    name: Native GUI Behavioral Tests (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-latest
            cache_key: linux
          - name: macOS
            os: macos-14
            cache_key: macos
          - name: Windows
            os: windows-latest
            cache_key: windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Cache native GUI test workspaces
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            adapters/gui/target
            adapters/gpui/target
          key: ${{ matrix.platform.cache_key }}-cargo-native-gui-tests-${{ hashFiles('adapters/gui/Cargo.lock', 'adapters/gpui/Cargo.lock') }}
          restore-keys: ${{ matrix.platform.cache_key }}-cargo-native-gui-tests-

      - name: Test adapter default behavior
        run: cargo test --manifest-path adapters/gui/Cargo.toml --workspace --lib --locked -- --test-threads=1

      - name: Test adapter 3D behavior
        run: cargo test --manifest-path adapters/gui/Cargo.toml --workspace --lib --features 3d --locked -- --test-threads=1

      - name: Test all adapter feature behavior
        run: cargo test --manifest-path adapters/gui/Cargo.toml --workspace --lib --all-features --locked -- --test-threads=1

      - name: Test adapter documentation
        run: |
          cargo test --manifest-path adapters/gui/Cargo.toml --workspace --doc --locked
          cargo test --manifest-path adapters/gui/Cargo.toml --workspace --doc --all-features --locked

      - name: Test GPUI default behavior
        run: cargo test --manifest-path adapters/gpui/Cargo.toml --lib --locked

      - name: Test GPUI 3D behavior
        run: cargo test --manifest-path adapters/gpui/Cargo.toml --lib --no-default-features --features 3d --locked

      - name: Test all GPUI feature behavior
        run: cargo test --manifest-path adapters/gpui/Cargo.toml --lib --all-features --locked

      - name: Test GPUI documentation
        run: |
          cargo test --manifest-path adapters/gpui/Cargo.toml --doc --locked
          cargo test --manifest-path adapters/gpui/Cargo.toml --doc --all-features --locked

      - name: Test native GUI smoke helper
        if: runner.os == 'Linux'
        run: python3 -m unittest scripts/test_smoke_native_gui_examples.py

      - name: Build all native GUI examples for smoke testing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          native_gui_stage_dir="${RUNNER_TEMP}/native-gui-examples"
          mkdir -p "${native_gui_stage_dir}"

          cargo build --manifest-path adapters/gui/Cargo.toml --package ruviz-egui --examples --all-features --locked --message-format=json-render-diagnostics > "${RUNNER_TEMP}/ruviz-egui-examples.json"
          python3 scripts/smoke_native_gui_examples.py stage \
            --cargo-json "${RUNNER_TEMP}/ruviz-egui-examples.json" \
            --stage-dir "${native_gui_stage_dir}" \
            --expect ruviz-egui:dashboard \
            --expect ruviz-egui:mixed_dashboard \
            --expect ruviz-egui:three_d

          cargo build --manifest-path adapters/gui/Cargo.toml --package ruviz-iced --examples --all-features --locked --message-format=json-render-diagnostics > "${RUNNER_TEMP}/ruviz-iced-examples.json"
          python3 scripts/smoke_native_gui_examples.py stage \
            --cargo-json "${RUNNER_TEMP}/ruviz-iced-examples.json" \
            --stage-dir "${native_gui_stage_dir}" \
            --expect ruviz-iced:dashboard \
            --expect ruviz-iced:dashboard_2d \
            --expect ruviz-iced:static_dashboard

          cargo build --manifest-path adapters/gui/Cargo.toml --package ruviz-slint --examples --all-features --locked --message-format=json-render-diagnostics > "${RUNNER_TEMP}/ruviz-slint-examples.json"
          python3 scripts/smoke_native_gui_examples.py stage \
            --cargo-json "${RUNNER_TEMP}/ruviz-slint-examples.json" \
            --stage-dir "${native_gui_stage_dir}" \
            --expect ruviz-slint:dashboard \
            --expect ruviz-slint:mixed_3d_dashboard

          cargo build --manifest-path adapters/gpui/Cargo.toml --examples --all-features --locked --message-format=json-render-diagnostics > "${RUNNER_TEMP}/gpui-examples.json"
          python3 scripts/smoke_native_gui_examples.py stage \
            --cargo-json "${RUNNER_TEMP}/gpui-examples.json" \
            --stage-dir "${native_gui_stage_dir}" \
            --expect ruviz-gpui:coordinate_events \
            --expect ruviz-gpui:fixed_bounds_dashboard \
            --expect ruviz-gpui:movable_annotation \
            --expect ruviz-gpui:observable_embed \
            --expect ruviz-gpui:plot3d_embed \
            --expect ruviz-gpui:static_embed \
            --expect ruviz-gpui:streaming_embed

      - name: Smoke all native GUI examples under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/smoke_native_gui_examples.py run \
            --stage-dir "${RUNNER_TEMP}/native-gui-examples" \
            --expect ruviz-egui:dashboard \
            --expect ruviz-egui:mixed_dashboard \
            --expect ruviz-egui:three_d \
            --expect ruviz-iced:dashboard \
            --expect ruviz-iced:dashboard_2d \
            --expect ruviz-iced:static_dashboard \
            --expect ruviz-slint:dashboard \
            --expect ruviz-slint:mixed_3d_dashboard \
            --expect ruviz-gpui:coordinate_events \
            --expect ruviz-gpui:fixed_bounds_dashboard \
            --expect ruviz-gpui:movable_annotation \
            --expect ruviz-gpui:observable_embed \
            --expect ruviz-gpui:plot3d_embed \
            --expect ruviz-gpui:static_embed \
            --expect ruviz-gpui:streaming_embed

  test-fast:
    name: Test Fast Lane
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Create test output directories
        run: |
          mkdir -p generated/tests/render
          mkdir -p generated/tests/export/{png,svg,raw,direct}

      - name: Run library tests
        run: cargo test --lib --verbose

      - name: Compile integration tests
        run: cargo test --tests --no-run --verbose

      # `ndarray` is the historical alias for `ndarray_support`; the ingestion
      # suite gates a test on `any(ndarray_support, ndarray)`, so the alias has
      # to be on for that test to be more than a compile check.
      - name: Run fast deterministic integration suites
        run: cargo test --features ndarray --test simple_api_test --test data_format_compatibility_test --test backend_parity_test --verbose

      # The suites below need nothing beyond the default features, so they run
      # here rather than as feature-matrix jobs: this lane has already built the
      # crate and compiled every target above. Each is named explicitly because
      # tests/integration/ci_test_coverage.rs requires every target to be
      # assigned to a lane -- the whole-suite `--all-features` run in
      # `test-feature-matrix` is a safety net and deliberately does not count.
      - name: Run styling and rendering suites
        run: cargo test --test color_palette_tests --test line_style_tests --test scatter_plot_tests --test tick_system_tests --test visual_traits_test --test mixed_coordinate_visual_test --test seaborn_theme_test --verbose

      - name: Run DPI and typography suites
        run: cargo test --test dpi_api_test --test dpi_scaling_test --test dpi_scaling_tests --test dpi_typography_scaling_test --verbose

      - name: Run pipeline, runtime and hygiene suites
        run: cargo test --test full_pipeline_test --test runtime_hardening_test --test memory_pool_tests --test small_dataset_optimization_test --test datashader_basic_test --test config_enum_defaults_test --test feature_hygiene_test --verbose

      # tests/integration/ci_test_coverage.rs fails when a tests/*.rs target is
      # compiled but never executed by this workflow, so run it in the cheapest
      # lane where a contributor sees the failure straight away.
      - name: Verify CI runs every test target it compiles
        run: cargo test --test integration --verbose

      - name: Run international text suite
        run: cargo test --test international_text_tests --verbose

      - name: Run doc tests
        run: cargo test --doc --verbose

  test-visual-golden:
    name: Deterministic Golden Images
    runs-on: ubuntu-24.04
    needs: [fmt, clippy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install fixed Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Assert the pinned rustc is the one that runs
        env:
          EXPECTED_RUSTC: "1.94.1"
        run: |
          actual="$(rustc --version | cut -d' ' -f2)"
          if [[ "${actual}" != "${EXPECTED_RUSTC}" ]]; then
            echo "::error::expected rustc ${EXPECTED_RUSTC}, got ${actual}; the tracked rust-toolchain.toml is outranking this job's toolchain selection"
            exit 1
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-visual-golden-1.94.1-${{ hashFiles('**/Cargo.lock', 'src/dejavu-sans.ttf', 'tests/fixtures/golden/*.png') }}

      - name: Create visual output directory
        run: mkdir -p generated/tests/render

      - name: Compare deterministic golden images
        run: cargo test --test visual_regression_test -- --ignored

      - name: Upload visual outputs and diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-golden-failure-${{ github.run_id }}
          path: generated/tests/render/*.png
          if-no-files-found: warn
          retention-days: 7

  test-feature-contract:
    name: Feature Contract (${{ matrix.contract.name }})
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        contract:
          - name: No defaults + Typst disabled
            cache-key: no-default
            command: cargo test --test typst_feature_gate_ui --no-default-features typst_requires_feature -- --exact
          - name: ndarray_support
            cache-key: ndarray-support
            command: cargo test --test data_format_compatibility_test --no-default-features --features ndarray_support test_ndarray_data -- --exact
          - name: ndarray legacy alias
            cache-key: ndarray-alias
            command: cargo test --test data_format_compatibility_test --no-default-features --features ndarray test_ndarray_data -- --exact
          - name: Typst enabled
            cache-key: typst-math
            command: >-
              cargo test --test typst_feature_gate_ui --no-default-features --features typst-math typst_with_feature_compiles -- --exact &&
              cargo test --lib --no-default-features --features typst-math core::plot::tests::typst::test_invalid_typst_snippet_returns_typst_error -- --exact
          - name: 3D CPU API and UI
            cache-key: 3d-cpu
            command: cargo test --no-default-features --features 3d --test three_d_api_test --test three_d_api_ui
          - name: 3D GPU compile
            cache-key: 3d-gpu
            command: cargo check --no-default-features --features 3d,gpu
          - name: 3D interactive GPU compile
            cache-key: 3d-interactive-gpu
            command: cargo check --no-default-features --features 3d,interactive-gpu
          - name: All features compile
            cache-key: all-features
            command: cargo check --all-features
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Assert the pinned rustc is the one that runs
        env:
          EXPECTED_RUSTC: "1.94.1"
        run: |
          actual="$(rustc --version | cut -d' ' -f2)"
          if [[ "${actual}" != "${EXPECTED_RUSTC}" ]]; then
            echo "::error::expected rustc ${EXPECTED_RUSTC}, got ${actual}; the tracked rust-toolchain.toml is outranking this job's toolchain selection"
            exit 1
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-feature-contract-${{ matrix.contract.cache-key }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux desktop build dependencies
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Create test output directory
        run: mkdir -p generated/tests/render

      - name: Verify feature contract
        run: ${{ matrix.contract.command }}

  test-feature-matrix:
    # The lane that actually runs the optional feature surfaces. Before it
    # existed, no `cargo test` in this workflow enabled `pdf`, `gpu`,
    # `interactive`, `polars_support` or `nalgebra_support`, so CI never
    # produced a PDF byte, never ingested a polars DataFrame, never exercised
    # the interactive event pipeline, and never ran the geometric assertions in
    # tests/three_d_correctness_test.rs.
    #
    # Every target under tests/ must be named by a `--test` flag of some lane
    # that runs on a pull request, in a job that enables the features the
    # target's cfgs need; tests/integration/ci_test_coverage.rs fails when one
    # is not. The `Every target` entry runs the whole suite under every feature
    # as a safety net so that a target nobody remembered to assign is still
    # executed while the guard is red -- it deliberately does not satisfy the
    # guard on its own, because a run that executes every target by
    # construction could never let the guard fail.
    name: Feature Matrix (${{ matrix.suite.name }})
    runs-on: ubuntu-24.04
    needs: [fmt, clippy]
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      WGPU_BACKEND: vulkan
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Every target, every feature
            cache-key: all-features
            command: cargo test --all-features --tests
          - name: PDF export
            cache-key: pdf
            command: cargo test --features pdf --test pdf_export_test --test export_format_tests
          - name: polars ingestion
            cache-key: polars
            command: cargo test --features polars_support --test ecosystem_data_integration_test
          # Every ingestion backend at once, including the `nalgebra` alias.
          # The suite gates each backend's tests on its own cfg, so only a run
          # that enables all of them executes all of them.
          - name: Ecosystem ingestion (every backend)
            cache-key: ecosystem
            command: cargo test --features polars_support,nalgebra_support,nalgebra --test ecosystem_data_integration_test
          - name: Interactive event pipeline
            cache-key: interactive
            command: cargo test --features interactive --test interactive_tests
          # The geometric assertions on the headline 3D feature. Before this
          # entry existed no job ran them at all. `pdf` is enabled because the
          # PDF export assertions in both suites are cfg'd on it.
          - name: 3D correctness
            cache-key: 3d
            command: cargo test --no-default-features --features 3d,pdf --test three_d_correctness_test --test three_d_spheres_test
          - name: 3D public API and static output
            cache-key: 3d-api
            command: cargo test --features 3d,pdf,nalgebra,nalgebra_support --test three_d_api_test --test three_d_api_ui --test three_d_visual_test
          - name: GPU backend
            cache-key: gpu
            command: cargo test --features gpu,interactive --test gpu_backend_test --test nonbreaking_plot_api_test
          # `typst-math` also gates most of visual_output_tests_fixed, which ran
          # only on a schedule and so never gated a pull request.
          - name: Typst math typesetting
            cache-key: typst
            command: cargo test --features typst-math --test typst_feature_gate_ui --test visual_output_tests_fixed
          - name: SIMD and parallel validation
            cache-key: performance
            command: cargo test --features simd --test performance_validation
          - name: Property tests
            cache-key: proptest
            command: cargo test --test property_tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Assert the pinned rustc is the one that runs
        env:
          EXPECTED_RUSTC: "1.94.1"
        run: |
          actual="$(rustc --version | cut -d' ' -f2)"
          if [[ "${actual}" != "${EXPECTED_RUSTC}" ]]; then
            echo "::error::expected rustc ${EXPECTED_RUSTC}, got ${actual}; the tracked rust-toolchain.toml is outranking this job's toolchain selection"
            exit 1
          fi

      - name: Install Linux desktop build dependencies
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Install Vulkan software adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-feature-matrix-${{ matrix.suite.cache-key }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-feature-matrix-${{ matrix.suite.cache-key }}-

      - name: Create test output directories
        run: |
          mkdir -p generated/tests/render
          mkdir -p generated/tests/export/{png,svg,raw,direct}

      - name: Run feature suite
        run: ${{ matrix.suite.command }}

      - name: Upload rendered output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feature-matrix-failure-${{ matrix.suite.cache-key }}-${{ github.run_id }}
          path: generated/tests
          if-no-files-found: warn
          retention-days: 7

  test-3d-gpu-required-adapter:
    name: 3D GPU Required Adapter (Vulkan llvmpipe)
    runs-on: ubuntu-24.04
    needs: [fmt, clippy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-3d-required-adapter-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Vulkan software adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary

      # `three_d_gpu_test` includes the same retained
      # `BackgroundRenderer3D::GpuReadback` path used by every native adapter,
      # and asserts a non-empty adapter name plus positive readback bytes.
      - name: Run direct 3D GPU suite with a required adapter
        run: |
          mkdir -p generated/tests/render
