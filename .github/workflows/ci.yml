  preview-scope:
    name: Preview Scope
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      run_preview: ${{ steps.scope.outputs.run_preview }}
      run_gallery: ${{ steps.scope.outputs.run_gallery }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect preview-relevant changes
        id: scope
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE_REF}"
          run_preview=false
          run_gallery=false
          while IFS= read -r path; do
            [ -z "${path}" ] && continue
            case "${path}" in
              .github/workflows/ci.yml|.github/actions/install-linux-desktop-build-deps/*|Cargo.toml|Cargo.lock|Makefile|package.json|bun.lock|generated/manifest.json|docs/BUILD_OUTPUTS.md|src/*|examples/*|bindings/python/*|packages/ruviz/*|bindings/wasm/*|apps/web-demo/*|scripts/*)
                run_preview=true
                break
                ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}...HEAD")
          while IFS= read -r path; do
            [ -z "${path}" ] && continue
            case "${path}" in
              scripts/generate_gallery.rs|tools/gallery/*|examples/doc_*.rs|examples/generate_golden_images.rs|examples/scientific_showcase.rs|examples/parallel_demo.rs|examples/memory_optimization_demo.rs|examples/generate_animation_gallery.rs|docs/gallery/*|docs/assets/rustdoc/*|docs/assets/gallery/*|docs/guide/*|tests/gallery_*|tests/common/visual.rs|tests/fixtures/golden/*|src/*|Makefile|.github/workflows/ci.yml)
                run_gallery=true
                break
                ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}...HEAD")
          {
            echo "run_preview=${run_preview}"
            echo "run_gallery=${run_gallery}"
          } >> "$GITHUB_OUTPUT"

  gallery-freshness:
    name: Gallery Regeneration
    runs-on: ubuntu-24.04
    needs: [preview-scope]
    if: needs.preview-scope.outputs.run_gallery == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install fixed Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Assert the pinned rustc is the one that runs
        env:
          EXPECTED_RUSTC: "1.94.1"
        run: |
          actual="$(rustc --version | cut -d' ' -f2)"
          if [[ "${actual}" != "${EXPECTED_RUSTC}" ]]; then
            echo "::error::expected rustc ${EXPECTED_RUSTC}, got ${actual}; the tracked rust-toolchain.toml is outranking this job's toolchain selection"
            exit 1
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gallery-1.94.1-${{ hashFiles('**/Cargo.lock', 'src/dejavu-sans.ttf', 'tests/fixtures/golden/gallery/gallery_subplots.png') }}
          restore-keys: ${{ runner.os }}-cargo-gallery-1.94.1-

      - name: Install Linux desktop build dependencies
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Create gallery failure artifact directory
        run: mkdir -p generated/tests/render

      - name: Compare deterministic subplot fixture
        run: cargo test --test gallery_visual_test -- --ignored

      - name: Check committed gallery freshness
        run: make check-rust-gallery

      - name: Regenerate deterministic gallery outputs
        if: always()
        run: cargo run --bin generate_gallery -- --deterministic-only

      - name: Verify deterministic gallery diff
        if: always()
        run: |
          if ! git diff --exit-code -- docs/gallery docs/assets/gallery/rust > generated/tests/gallery-diff.txt; then
            cat generated/tests/gallery-diff.txt
            exit 1
          fi

      - name: Upload gallery outputs and diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-freshness-failure-${{ github.run_id }}
          path: |
            generated/tests/render/*.png
            generated/tests/gallery-diff.txt
          if-no-files-found: warn
          retention-days: 7

  generated-preview-rust:
    name: Generated Preview (Rust)
    runs-on: ubuntu-latest
    needs: [preview-scope]
    if: needs.preview-scope.outputs.run_preview == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-generated-preview-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-generated-preview-rust-

      - name: Build Rust preview artifacts
        run: make build-generated-preview-rust

      - name: Pack staged Rust preview
        run: tar -czf generated-preview-stage-examples.tar.gz generated/examples

      - name: Upload staged Rust preview
        uses: actions/upload-artifact@v4
        with:
          name: generated-preview-stage-examples
          path: generated-preview-stage-examples.tar.gz
          retention-days: 1
          if-no-files-found: error

  generated-preview-python:
    name: Generated Preview (Python)
    runs-on: ubuntu-latest
    needs: [preview-scope]
    if: needs.preview-scope.outputs.run_preview == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          working-directory: bindings/python

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-generated-preview-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-generated-preview-python-

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache preview wasm tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruviz-tools
          key: ${{ runner.os }}-ruviz-tools-${{ hashFiles('Cargo.lock', 'packages/ruviz/scripts/ensure-wasm-pack.sh', 'packages/ruviz/scripts/ensure-wasm-bindgen.sh') }}
          restore-keys: ${{ runner.os }}-ruviz-tools-

      - name: Install Linux desktop build dependencies
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Sync Python dependencies
        run: cd bindings/python && uv sync

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install JS workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build Python preview artifacts
        run: make build-generated-preview-python

      - name: Pack staged Python preview
        run: tar -czf generated-preview-stage-python-site.tar.gz generated/python/site

      - name: Upload staged Python preview
        uses: actions/upload-artifact@v4
        with:
          name: generated-preview-stage-python-site
          path: generated-preview-stage-python-site.tar.gz
          retention-days: 1
          if-no-files-found: error

  generated-preview-web:
    name: Generated Preview (Web)
    runs-on: ubuntu-latest
    needs: [preview-scope]
    if: needs.preview-scope.outputs.run_preview == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-generated-preview-web-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-generated-preview-web-

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache preview wasm tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruviz-tools
          key: ${{ runner.os }}-ruviz-tools-${{ hashFiles('Cargo.lock', 'packages/ruviz/scripts/ensure-wasm-pack.sh', 'packages/ruviz/scripts/ensure-wasm-bindgen.sh') }}
          restore-keys: ${{ runner.os }}-ruviz-tools-

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install JS workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build web preview artifacts
        run: make build-generated-preview-web

      - name: Pack staged web preview
        run: tar -czf generated-preview-stage-web-docs.tar.gz generated/web/docs

      - name: Upload staged web preview
        uses: actions/upload-artifact@v4
        with:
          name: generated-preview-stage-web-docs
          path: generated-preview-stage-web-docs.tar.gz
          retention-days: 1
          if-no-files-found: error

  generated-preview-package:
    name: Generated Preview
    runs-on: ubuntu-latest
    needs: [preview-scope, generated-preview-rust, generated-preview-python, generated-preview-web]
    if: github.event_name == 'pull_request' && always() && !cancelled()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Resolve preview state
        id: state
        env:
          RUN_PREVIEW: ${{ needs.preview-scope.outputs.run_preview }}
          RUST_RESULT: ${{ needs.generated-preview-rust.result }}
          PYTHON_RESULT: ${{ needs.generated-preview-python.result }}
          WEB_RESULT: ${{ needs.generated-preview-web.result }}
        run: |
          if [[ "${RUN_PREVIEW}" != "true" ]]; then
            echo "mode=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${RUST_RESULT}" != "success" || "${PYTHON_RESULT}" != "success" || "${WEB_RESULT}" != "success" ]]; then
            echo "mode=failed" >> "$GITHUB_OUTPUT"
            echo "one or more preview component jobs failed" >&2
            exit 1
          fi
          echo "mode=package" >> "$GITHUB_OUTPUT"

      - name: Download staged Rust preview
        if: steps.state.outputs.mode == 'package'
        uses: actions/download-artifact@v4
        with:
          name: generated-preview-stage-examples
          path: preview-staging/examples

      - name: Download staged Python preview
        if: steps.state.outputs.mode == 'package'
        uses: actions/download-artifact@v4
        with:
          name: generated-preview-stage-python-site
          path: preview-staging/python

      - name: Download staged web preview
        if: steps.state.outputs.mode == 'package'
        uses: actions/download-artifact@v4
        with:
          name: generated-preview-stage-web-docs
          path: preview-staging/web

      - name: Extract staged preview artifacts
        if: steps.state.outputs.mode == 'package'
        run: |
          tar -xzf preview-staging/examples/generated-preview-stage-examples.tar.gz
          tar -xzf preview-staging/python/generated-preview-stage-python-site.tar.gz
          tar -xzf preview-staging/web/generated-preview-stage-web-docs.tar.gz

      - name: Generate preview manifest
        if: steps.state.outputs.mode == 'package'
        run: make generated-manifest

      - name: Verify published docs asset references
        if: steps.state.outputs.mode == 'package'
        run: make check-doc-asset-refs

      - name: Compare manifest to base branch
        id: manifest
        if: steps.state.outputs.mode == 'package'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE_REF}"
          if git show "origin/${BASE_REF}:generated/manifest.json" > /tmp/base-generated-manifest.json 2>/dev/null; then
            if cmp -s /tmp/base-generated-manifest.json generated/manifest.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package preview artifacts
        id: package
        if: steps.state.outputs.mode == 'package' && steps.manifest.outputs.changed == 'true'
        run: |
          preview_examples=()
          for path in generated/examples; do
            if [ -d "$path" ]; then
              preview_examples+=("$path")
            fi
          done
          if [ ${#preview_examples[@]} -eq 0 ]; then
            mkdir -p generated/empty-preview
            preview_examples=("generated/empty-preview")
          fi
          tar -czf generated-preview-examples.tar.gz "${preview_examples[@]}"
          tar -czf generated-preview-python-site.tar.gz generated/python/site
          tar -czf generated-preview-web-docs.tar.gz generated/web/docs
          echo "examples_size=$(du -sh generated-preview-examples.tar.gz | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "python_site_size=$(du -sh generated-preview-python-site.tar.gz | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "web_docs_size=$(du -sh generated-preview-web-docs.tar.gz | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload examples preview
        if: steps.state.outputs.mode == 'package' && steps.manifest.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-preview-examples
          path: generated-preview-examples.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Upload Python docs preview
        if: steps.state.outputs.mode == 'package' && steps.manifest.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-preview-python-site
          path: generated-preview-python-site.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Upload web docs preview
        if: steps.state.outputs.mode == 'package' && steps.manifest.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-preview-web-docs
          path: generated-preview-web-docs.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Upload manifest
        if: steps.state.outputs.mode == 'package' && steps.manifest.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-manifest
          path: generated/manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: Update pull request comment
        if: github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        env:
          PREVIEW_MODE: ${{ steps.state.outputs.mode }}
          MANIFEST_CHANGED: ${{ steps.manifest.outputs.changed }}
          EXAMPLES_SIZE: ${{ steps.package.outputs.examples_size }}
          PYTHON_SITE_SIZE: ${{ steps.package.outputs.python_site_size }}
          WEB_DOCS_SIZE: ${{ steps.package.outputs.web_docs_size }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        with:
          script: |
            const marker = "<!-- generated-preview-comment -->";
            const changed = process.env.MANIFEST_CHANGED === "true";
            const mode = process.env.PREVIEW_MODE;
            const body =
              mode === "skipped"
                ? `${marker}
            ## Generated Preview Artifacts

            Generated preview was skipped because this pull request does not touch preview-relevant files.

            Workflow run: ${process.env.RUN_URL}

            Published docs still read only from committed assets under \`docs/assets/**\`, \`bindings/python/docs/assets/gallery/**\`, and \`tests/fixtures/golden/**\`.`
                : changed
                  ? `${marker}
            ## Generated Preview Artifacts

            Generated output changed relative to \`${process.env.BASE_REF}\`.

            - \`generated-preview-examples\` (${process.env.EXAMPLES_SIZE})
            - \`generated-preview-python-site\` (${process.env.PYTHON_SITE_SIZE})
            - \`generated-preview-web-docs\` (${process.env.WEB_DOCS_SIZE})
            - \`generated-manifest\`

            Workflow run: ${process.env.RUN_URL}

            Published docs still read only from committed assets under \`docs/assets/**\`, \`bindings/python/docs/assets/gallery/**\`, and \`tests/fixtures/golden/**\`.`
                  : `${marker}
            ## Generated Preview Artifacts

            The regenerated \`generated/manifest.json\` matches \`${process.env.BASE_REF}\`, so CI did not upload fresh preview archives for this PR.

            Workflow run: ${process.env.RUN_URL}

            Published docs still read only from committed assets under \`docs/assets/**\`, \`bindings/python/docs/assets/gallery/**\`, and \`tests/fixtures/golden/**\`.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
