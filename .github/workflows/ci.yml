            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-web-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-web-

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Check core wasm targets
        run: |
          cargo check --target wasm32-unknown-unknown --no-default-features
          cargo check --target wasm32-unknown-unknown --no-default-features --features 3d
          cargo check --target wasm32-unknown-unknown --no-default-features --features 3d,gpu
          cargo check --target wasm32-unknown-unknown --no-default-features --features svg
          cargo check --target wasm32-unknown-unknown --no-default-features --features gpu

      - name: Check ruviz-web
        run: |
          cargo check -p ruviz-web --target wasm32-unknown-unknown
          cargo check -p ruviz-web --target wasm32-unknown-unknown --no-default-features --features 3d-gpu

      - name: Install JS workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check JS/TS formatting and lint
        run: bun run check:web

      - name: Build web SDK and demo
        run: bun run build:web

      - name: Install Playwright browsers
        run: bun run install:web-browsers

      - name: Install Chromium Vulkan software adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Run cross-browser 2D smoke tests
        run: bun run --cwd apps/web-demo test:e2e -- tests/browser.spec.js

      - name: Run Chromium 3D WebGPU smoke test
        run: bun run --cwd apps/web-demo test:e2e -- tests/3d.spec.js --project=chromium

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-web-playwright-failure-${{ github.run_id }}
          path: |
            apps/web-demo/playwright-report
            apps/web-demo/test-results
          if-no-files-found: warn
          retention-days: 7

  docs:
