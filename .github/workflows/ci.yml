  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    # `rust-toolchain.toml` pins 1.94.1, and rustup ranks a toolchain file ABOVE
    # `rustup default` — which is all `dtolnay/rust-toolchain` sets. So this job
    # silently compiled with 1.94.1 while reporting that it tested the MSRV.
    # `RUSTUP_TOOLCHAIN` outranks the toolchain file, so it is what actually
    # makes the selection stick; the assertion below proves it did.
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      # rust-toolchain.toml pins 1.94.1 and a toolchain file outranks
      # `rustup default`. Without this assertion the MSRV job can compile with
      # 1.94.1 and go green while the crate no longer builds on its rust-version.
      - name: Assert the pinned rustc is the one that runs
        env:
          EXPECTED_RUSTC: "1.92.0"
        run: |
          actual="$(rustc --version | cut -d' ' -f2)"
          if [[ "${actual}" != "${EXPECTED_RUSTC}" ]]; then
            echo "::error::expected rustc ${EXPECTED_RUSTC}, got ${actual}; the tracked rust-toolchain.toml is outranking this job's toolchain selection"
            exit 1
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux desktop build dependencies
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Check MSRV
        run: cargo check --all-features

      - name: Check all-feature examples
        run: cargo check --examples --all-features

