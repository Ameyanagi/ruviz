  platform-build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: FreeBSD
            os: ubuntu-latest
            target: x86_64-unknown-freebsd
            cross: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            adapters/gpui/target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Install GPUI Linux build dependencies
        if: matrix.platform.name == 'Linux'
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Install cross
        if: matrix.platform.cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (cross)
        if: matrix.platform.cross
        run: cross check --target ${{ matrix.platform.target }}

      - name: Check 3D CPU build (cross)
        if: matrix.platform.cross
        run: cross check --target ${{ matrix.platform.target }} --no-default-features --features 3d

      - name: Build (native)
        if: ${{ !matrix.platform.cross }}
        run: cargo check --target ${{ matrix.platform.target }}

      - name: Check 3D CPU desktop build
        if: ${{ !matrix.platform.cross }}
        run: cargo check --target ${{ matrix.platform.target }} --no-default-features --features 3d

      - name: Check 3D interactive GPU desktop build
        if: ${{ !matrix.platform.cross }}
        run: cargo check --target ${{ matrix.platform.target }} --no-default-features --features 3d,interactive-gpu

      - name: Check interactive desktop build
        if: ${{ !matrix.platform.cross }}
        run: cargo check --target ${{ matrix.platform.target }} --features interactive

      # ruviz-gpui is a separate workspace (see the root Cargo.toml): `-p` cannot
      # reach it, and that is deliberate — every step above this point now
      # resolves from crates.io alone instead of dragging in the zed checkout.
      - name: Check ruviz-gpui desktop build
        if: ${{ !matrix.platform.cross }}
        run: cargo check --manifest-path adapters/gpui/Cargo.toml --target ${{ matrix.platform.target }} --locked

      - name: Check ruviz-gpui 3D GPU desktop build
        if: ${{ !matrix.platform.cross }}
        run: cargo check --manifest-path adapters/gpui/Cargo.toml --target ${{ matrix.platform.target }} --no-default-features --features 3d-gpu --locked

      - name: Check ruviz-gpui desktop examples
        if: ${{ !matrix.platform.cross }}
        run: cargo check --manifest-path adapters/gpui/Cargo.toml --target ${{ matrix.platform.target }} --examples --locked

      - name: Check ruviz-gpui 3D desktop example
        if: ${{ !matrix.platform.cross }}
        run: cargo check --manifest-path adapters/gpui/Cargo.toml --target ${{ matrix.platform.target }} --example plot3d_embed --all-features --locked

  gui-adapters:
    name: Native GUI Adapters (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
