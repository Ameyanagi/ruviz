  python:
    name: Python (${{ matrix.python.version }})
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported interpreter plus the newest stable one; the steps that
        # do not depend on the interpreter version only run on the newest lane.
        python:
          - version: "3.10"
            shared_checks: false
          - version: "3.13"
            shared_checks: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python.version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          working-directory: bindings/python

      - name: Setup Bun
        if: matrix.python.shared_checks
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install Linux desktop build dependencies
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Sync Python dependencies
        run: cd bindings/python && uv sync --python "${{ matrix.python.version }}"

      - name: Install wasm target
        if: matrix.python.shared_checks
        run: rustup target add wasm32-unknown-unknown

      - name: Install JS workspace dependencies
        if: matrix.python.shared_checks
        run: bun install --frozen-lockfile

      - name: Verify notebook widget bundle is reproducible
        if: matrix.python.shared_checks
        run: |
          bun run build:python-widget
          first_widget="$(mktemp)"
          cp bindings/python/ruviz_py/ruviz/widget.js "${first_widget}"
          bun run build:python-widget
          sha256sum "${first_widget}" bindings/python/ruviz_py/ruviz/widget.js
          cmp --silent "${first_widget}" bindings/python/ruviz_py/ruviz/widget.js

      - name: Run Python extension tests
        if: matrix.python.shared_checks
        run: cd bindings/python && uv run cargo test

      - name: Run Python package tests
        run: cd bindings/python && uv run python -m pytest

      - name: Run Python lint
        if: matrix.python.shared_checks
        run: cd bindings/python && uv run python -m ruff check

      - name: Run Python type check
        if: matrix.python.shared_checks
        run: cd bindings/python && uv run python -m pyright

      - name: Build Python docs
        if: matrix.python.shared_checks
        run: cd bindings/python && uv run python -m mkdocs build --strict

  python-packaging:
    name: Python Packaging
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          working-directory: bindings/python

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install Linux desktop build dependencies
        uses: ./.github/actions/install-linux-desktop-build-deps

      - name: Sync Python dependencies
        run: cd bindings/python && uv sync

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install JS workspace dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild notebook widget bundle
        run: bun run build:python-widget

      - name: Build Python sdist
        run: cd bindings/python && uv run maturin sdist --out dist

      - name: Smoke test sdist install
        run: |
          tempdir="$(mktemp -d)"
          uv venv --python 3.12 "${tempdir}/venv"
          uv pip install --python "${tempdir}/venv/bin/python" bindings/python/dist/ruviz-*.tar.gz
          "${tempdir}/venv/bin/python" bindings/python/scripts/smoke_test_wheel.py --label sdist

      - name: Build Linux wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.12.6
          rust-toolchain: 1.94.1
          manylinux: 2_28
          target: x86_64-unknown-linux-gnu
          working-directory: bindings/python
          args: --release --out dist --compatibility pypi --interpreter python3.10 --no-default-features --features pyo3/extension-module

      # The abi3 wheel is built once against Python 3.10, so it has to import on
      # both ends of the supported range.
      - name: Smoke test Linux wheel
        run: |
          for version in 3.10 3.13; do
            tempdir="$(mktemp -d)"
            uv venv --python "${version}" "${tempdir}/venv"
            uv pip install --python "${tempdir}/venv/bin/python" bindings/python/dist/ruviz-*.whl
            "${tempdir}/venv/bin/python" bindings/python/scripts/smoke_test_wheel.py \
              --label "linux wheel python ${version}" --no-native-show
          done

  npm-package:
    name: NPM Package
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

