          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-gui-adapters-${{ hashFiles('adapters/gui/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-gui-adapters-

      - name: Check default adapter features
        run: cargo check --manifest-path adapters/gui/Cargo.toml --workspace --target ${{ matrix.platform.target }} --locked

      - name: Check 3D adapter features
        run: cargo check --manifest-path adapters/gui/Cargo.toml --workspace --target ${{ matrix.platform.target }} --features 3d --locked

      - name: Check all adapter features
        run: cargo check --manifest-path adapters/gui/Cargo.toml --workspace --target ${{ matrix.platform.target }} --all-features --locked

      - name: Check adapter examples
        run: cargo check --manifest-path adapters/gui/Cargo.toml --workspace --target ${{ matrix.platform.target }} --examples --all-features --locked

      - name: Build adapter documentation
        run: cargo doc --manifest-path adapters/gui/Cargo.toml --workspace --target ${{ matrix.platform.target }} --all-features --no-deps --locked
