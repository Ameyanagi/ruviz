[package]
name = "ruviz-web"
version = "0.7.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Browser runtime adapter for ruviz"
repository = "https://github.com/Ameyanagi/ruviz"
readme = "README.md"

# This crate targets the browser: document the wasm build the npm pipeline ships
# (`wasm-pack build --features 3d-gpu`), which also exposes the wasm32-only items.
# `targets = []` keeps docs.rs from spending builds on native targets.
[package.metadata.docs.rs]
all-features = true
default-target = "wasm32-unknown-unknown"
targets = []

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["embedded-font"]
# Bundles a Noto Sans face (~569 KB) into the wasm and registers it
# automatically. On by default so the module renders text out of the box.
# Turn it off to drop that weight from the module and supply a face yourself
# via `register_font_bytes_js` — as a separate cacheable, subsettable asset.
# Without it, any render that needs text fails with an actionable error rather
# than drawing blanks.
"embedded-font" = []
"3d" = ["ruviz/3d"]
"3d-gpu" = ["3d", "ruviz/gpu", "dep:wgpu", "dep:wasm-bindgen-futures"]

[dependencies]
ruviz = { version = "0.7.0", path = "../..", default-features = false }
js-sys = "0.3.92"
wasm-bindgen = "0.2.105"
console_error_panic_hook = "0.1.7"
wgpu = { version = "29.0", optional = true }
wasm-bindgen-futures = { version = "0.4.55", optional = true }

[dependencies.web-sys]
version = "0.3.92"
features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "ImageData",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
]
