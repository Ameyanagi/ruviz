[package]
name = "ruviz-py"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Python bindings and notebook widget support for ruviz"
repository = "https://github.com/Ameyanagi/ruviz"
readme = "README.md"
publish = false

[features]
default = ["native-interactive"]
native-interactive = ["ruviz/interactive"]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.24"
pollster = "0.4"
pyo3 = { version = "0.24", features = ["abi3-py310"] }
ruviz = { path = "../..", version = "0.9.0", default-features = false, features = ["3d", "parallel", "pdf", "svg"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
