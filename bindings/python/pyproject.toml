[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "ruviz"
version = "0.10.0"
description = "Python bindings and notebook widget support for ruviz"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Ruviz Contributors" }]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
widget = [
  "anywidget>=0.9",
  "traitlets>=5.14",
]
dataframes = [
  "pandas>=2.2",
  "polars>=1.0",
]
pandas = [
  "pandas>=2.2",
]
polars = [
  "polars>=1.0",
]
all = [
  "anywidget>=0.9",
  "pandas>=2.2",
  "polars>=1.0",
  "traitlets>=5.14",
]

[dependency-groups]
dev = [
  "anywidget>=0.9",
  "ipykernel>=6.0",
  "maturin>=1.8,<2.0",
  "mkdocs-material>=9.6",
  "mkdocs>=1.6",
  "mkdocstrings[python]>=0.30",
  "pandas>=2.2",
  "polars>=1.0",
  "pyright>=1.1.400",
  "pytest>=8.0",
  "ruff>=0.12",
  "tomli>=2.0; python_version < '3.11'",
  "traitlets>=5.14",
]
bench = [
  "matplotlib>=3.10",
]

[tool.maturin]
python-source = "ruviz_py"
module-name = "ruviz._native"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
include = ["ruviz_py", "tests/typing"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# Negative typing cases in tests/typing assert their errors with `# pyright: ignore`
# comments; this turns a comment that stopped suppressing anything into a failure.
reportUnnecessaryTypeIgnoreComment = "error"
# traitlets ships py.typed but does not re-export its trait types explicitly.
reportPrivateImportUsage = "none"
