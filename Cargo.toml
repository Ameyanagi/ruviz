[workspace]
members = ["bindings/wasm", "bindings/python"]
# `adapters/gpui` is deliberately NOT a member: it is its own workspace so
# that its `[patch.crates-io]` GPUI override — a pin to a zed monorepo git rev —
# cannot reach anything built here. `[patch]` is workspace-scoped and
# `default-members` does not exempt it, so while the adapter was a member *every*
# cargo invocation in this repository, `cargo check -p ruviz` included, resolved
# the zed checkout: 38 `git+` lockfile entries from 6 repositories and two
# separate wgpu builds, paid by roughly 22 CI jobs on a cold cache. The root
# lockfile now resolves entirely from crates.io, and
# `scripts/verify_packaged_crates.py` fails the publish gate if a single `git+`
# source reappears in it.
#
# Build the adapter with `--manifest-path adapters/gpui/Cargo.toml`.
exclude = ["adapters/gpui", "adapters/gui"]
# Keep plain root cargo commands focused on the cross-platform core crate.
default-members = ["."]
resolver = "2"

[package]
name = "ruviz"
version = "0.7.0"
edition = "2024"
rust-version = "1.92"
authors = ["Ruviz Contributors"]
description = "High-performance 2D plotting library for Rust"
license = "MIT OR Apache-2.0"
keywords = ["plotting", "visualization", "graphics", "charts"]
categories = ["visualization", "graphics"]
repository = "https://github.com/Ameyanagi/ruviz"
readme = "README.md"
include = [
    "/src/**",
    "/benches/*.rs",
    "/examples/**/*.rs",
    "/tools/gallery/**/*.rs",
    "/scripts/generate_gallery.rs",
    "/docs/assets/readme/readme_example.png",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

# docs.rs builds on x86_64-unknown-linux-gnu with no project-specific system
# packages installed, so `all-features = true` is not safe here: the
# `interactive`/`interactive-gpu`/`window`/`full` features pull `rfd` with the
# `gtk3` backend on Linux, which needs the GTK-3 development headers that our own
# CI has to install by hand (.github/actions/install-linux-desktop-build-deps).
# A failed docs.rs build publishes no documentation at all, so we enumerate the
# pure-Rust features instead; every one below adds public API. `svg` is omitted
# because it adds none: SVG export is unconditional (see `[features]`).
[package.metadata.docs.rs]
features = [
    "3d",
    "animation",
    "animation-video",
    "gpu",
    "nalgebra_support",
    "ndarray_support",
    "pdf",
    "performance",
    "polars_support",
    "serde",
    "typst-math",
]
# Activates `#![cfg_attr(docsrs, feature(doc_cfg))]` in src/lib.rs so feature-gated
# items are labelled with the feature that enables them.
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Core rendering
tiny-skia = "0.12"
tiny-skia-path = "0.12"

# Math & geometry
glam = "0.32"
nalgebra = { version = "0.34", optional = true }

# Color management
palette = "0.7"

# Text rendering - unified on cosmic-text (pure Rust)
cosmic-text = "0.16"  # Professional text layout, shaping, and font discovery
swash = "0.2"  # Distinguish premultiplied color outlines from straight color bitmaps
ttf-parser = "0.25"  # Validate registered font faces before mutating shared state
unicode-width = "0.2"
typst = { version = "0.13.1", optional = true }
typst-svg = { version = "0.13.1", optional = true }
typst-render = { version = "0.13.1", optional = true }
typst-kit = { version = "0.13.1", default-features = false, features = ["fonts", "embed-fonts"], optional = true }

# Data structures (optional)
ndarray = { version = "0.17", optional = true }
polars = { version = "0.50", optional = true }

# Image I/O
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = { version = "0.22", optional = true }

# PDF export (SVG → PDF pipeline)
svg2pdf = { version = "0.13", optional = true }  # Uses usvg 0.43 internally

# Error handling
thiserror = "2.0"

# Serialization (for themes/configs)
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Performance optimization
rayon = { version = "1.11", optional = true }

# GPU acceleration (optional)
wgpu = { version = "29.0", optional = true }
bytemuck = { version = "1.25", optional = true }
# `wgsl_bindgen` is deliberately absent: nothing referenced it (there is no
# build script, and no source file mentions it), and it pulled `naga_oil` ->
# `naga` 26 with default features. That turned on `codespan-reporting`'s
# `termcolor` feature, which unifies across every crate sharing
# `codespan-reporting` 0.12 -- including the `naga` 27 that `iced_wgpu` uses,
# which writes diagnostics into a `String` and only compiles with `termcolor`
# off. Re-adding it breaks any build combining `gpu` with a wgpu-backed GUI
# adapter.
pollster = { version = "0.4", optional = true }
futures-intrusive = { version = "0.5", optional = true }

# Logging
log = "0.4"

# SIMD optimization
wide = { version = "0.7", optional = true }

# Window support (optional)
winit = { version = "0.30", optional = true }
raw-window-handle = { version = "0.6", optional = true }
softbuffer = { version = "0.4", optional = true }
arboard = { version = "3.6.1", optional = true }

# Animation export
gif = { version = "0.14", optional = true }
color_quant = { version = "1.1", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

# FreeBSD support
[target.'cfg(target_os = "freebsd")'.dependencies]
ctor = "0.8"
# A range, not `=0.15.4`: an exact pin on a dependency reachable from the public
# `window` feature makes any downstream needing ^0.15.5 unresolvable, with no
# workaround short of forking. Cargo.lock pins the exact build this repo tests.
rfd = { version = "0.15", optional = true, default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "linux")'.dependencies]
# A range, not `=0.15.4`: an exact pin on a dependency reachable from the public
# `window` feature makes any downstream needing ^0.15.5 unresolvable, with no
# workaround short of forking. Cargo.lock pins the exact build this repo tests.
rfd = { version = "0.15", optional = true, default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "macos")'.dependencies]
# See the linux block above for why this is a range rather than an exact pin.
rfd = { version = "0.15", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
# See the linux block above for why this is a range rather than an exact pin.
rfd = { version = "0.15", optional = true, default-features = false }

[dev-dependencies]
anyhow = "1.0"
criterion = { version = "0.8", features = ["html_reports"] }
approx = "0.5"
tempfile = "3.27"
rand = "0.10"
tokio = { version = "1.50", features = ["full"] }
env_logger = "0.11"
regex = "1"
proptest = "1.11"
trybuild = "1.0"
sha2 = "0.10"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "line_series"] }

# Every optional dependency is referenced as `dep:<name>` so that Cargo does not
# also mint an implicit feature named after the crate. Without `dep:`, a user
# asking for `--features rayon` got the rayon *crate* compiled while every
# `cfg(feature = "parallel")` site stayed switched off — a feature flag that
# links a dependency and enables no code. The only feature names that may
# duplicate a dependency name are the explicit aliases below, which forward to
# the canonical feature.
#
# Invariant enforced by `tests/feature_hygiene_test.rs`: every feature declared
# here either has at least one `cfg(feature = "...")` site in the repository or
# is listed there as a deliberate alias/aggregate.
[features]
default = ["ndarray_support", "parallel"]

# Experimental 3D plotting. CPU/static support lives in this feature; direct
# GPU rendering composes with the existing `gpu` feature.
"3d" = ["dep:base64"]

# Display and window features.
# `interactive` owns both the desktop dependencies and the `cfg(feature =
# "interactive")` code; `window` is kept only as an alias for it. They were
# separate flags until 2026-07, but `window` gated no code at all, so asking for
# it pulled winit + softbuffer + rfd(GTK3) + arboard and changed nothing.
interactive = ["dep:winit", "dep:raw-window-handle", "dep:softbuffer", "dep:rfd", "dep:arboard"]
window = ["interactive"]  # Alias: historical name for `interactive`
interactive-gpu = ["interactive", "gpu"]  # Interactive mode WITH GPU acceleration

# Serialization
serde = ["dep:serde", "dep:serde_json", "palette/serde"]

# Data format support
ndarray_support = ["dep:ndarray"]
polars_support = ["dep:polars"]
nalgebra_support = ["dep:nalgebra"]
# Backward-compatibility aliases (historical feature names)
ndarray = ["ndarray_support"]
nalgebra = ["nalgebra_support"]
polars = ["polars_support"]

# Performance optimization features.
# `parallel` is on by default because the software 3D rasterizer genuinely uses
# it: tiles are rendered through `rayon` at
# `src/render/three_d/software/raster.rs`, with a serial fallback that
# `serial_and_parallel_software_tiles_are_byte_identical` pins as byte-identical.
# It does *not* reach the 2D raster path at all: the unreachable 2D
# series-parallel renderer was deleted in 2026-07, so `parallel` changes no 2D
# output and no 2D timing.
parallel = ["dep:rayon"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "dep:futures-intrusive"]
simd = ["dep:wide"]
performance = ["parallel", "simd"]

# Export format features.
# `svg` gates nothing: SVG export (`render_to_svg`/`export_svg`) is always
# compiled in. It is retained purely so existing `features = ["svg"]`
# selections keep resolving, and is a no-op.
svg = []
pdf = ["dep:svg2pdf"]
typst-math = ["dep:typst", "dep:typst-svg", "dep:typst-render", "dep:typst-kit"]

# Animation export features.
# `animation-gif` (an exact duplicate of `animation`) and `animation-hq-gif`
# (which pulled the C-building `gifski` crate that no code referenced) were
# removed in 2026-07: neither gated a single line.
animation = ["dep:gif", "dep:color_quant", "dep:crossbeam-channel"]
# Compatibility aggregate retained for manifests that selected the historical
# name. Ruviz currently ships GIF animation only; AV1 also needs a supported
# container/muxing implementation before this feature can promise video output.
animation-video = ["animation"]

# Full feature set
full = ["3d", "ndarray_support", "polars_support", "nalgebra_support", "serde", "performance", "gpu", "pdf", "interactive-gpu", "animation", "typst-math"]

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
debug = true

