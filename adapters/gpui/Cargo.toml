# This crate is its own workspace, separate from the one rooted at the
# repository root. That is the whole point of the split: `[patch.crates-io]` is
# workspace-scoped, so keeping the GPUI override *here* is what stops every
# `cargo` command run at the repository root from resolving the zed monorepo
# checkout. Do not add this directory back to the root `members` list — the root
# `Cargo.toml` excludes it and `scripts/verify_packaged_crates.py` fails if the
# two workspaces are merged again.
#
# `resolver = "2"` mirrors the root workspace on purpose: splitting the
# workspace must not also change how dependency versions get selected.
[workspace]
resolver = "2"

# Temporary GPUI override while crates.io still ships gpui 0.2.2. This applies on
# every target because `[patch.crates-io]` cannot be target-gated; the specific
# fix we need is the macOS right-drag delivery change from
# https://github.com/zed-industries/zed/pull/49637.
#
# This `rev` is the single source of truth for the zed pin: every git
# dev-dependency below must name the same repository and the same rev, and
# `scripts/verify_packaged_crates.py` fails if they ever drift apart.
[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", rev = "3060e4170ea5ef0e6886b9ac1853aaead9ddd59f" }

[package]
name = "ruviz-gpui"
version = "0.13.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "GPUI component adapter for ruviz"
repository = "https://github.com/Ameyanagi/ruviz"
readme = "README.md"

# Every feature here only forwards to a pure-Rust ruviz feature, so enabling all
# of them adds no system dependency beyond what the default build (gpui + rfd)
# already needs on the docs.rs Linux builder.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
gpu = ["ruviz/gpu"]
"3d" = ["ruviz/3d"]
"3d-gpu" = ["3d", "gpu"]

[dependencies]
ruviz = { version = "0.13.0", path = "../.." }
image = "0.25"
smallvec = "1.15"
futures = "0.3"
arboard = "3.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = "0.2.2"
core-foundation = "0.10"
core-video = "0.5"
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = "0.2.2"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui = "0.2.2"
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
smol = "2"

[[example]]
name = "plot3d_embed"
path = "examples/plot3d_embed.rs"
required-features = ["3d"]

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
# Pinned to the same zed rev as the `[patch.crates-io]` override above; the
# publish gate enforces that, so it cannot silently drift.
# The platform otherwise selects NoopTextSystem, leaving example labels blank.
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "3060e4170ea5ef0e6886b9ac1853aaead9ddd59f", package = "gpui_macos", features = ["runtime_shaders", "font-kit"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "3060e4170ea5ef0e6886b9ac1853aaead9ddd59f", features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "3060e4170ea5ef0e6886b9ac1853aaead9ddd59f" }

[[example]]
name = "molecular_spheres"
path = "examples/molecular_spheres.rs"
required-features = ["3d"]
